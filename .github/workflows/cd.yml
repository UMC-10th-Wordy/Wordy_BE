name: CD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/wordy_deploy_key
          chmod 600 ~/.ssh/wordy_deploy_key

          ssh-keyscan -T 5 -H "$SERVER_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Deploy application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/wordy_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          export NVM_DIR="$HOME/.nvm"

          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            echo "nvm.sh not found"
            exit 1
          fi

          . "$NVM_DIR/nvm.sh"
          nvm use 22.23.1 >/dev/null

          cd "$HOME/Wordy_BE"

          echo "== Sync origin/main =="
          git fetch origin --prune
          git checkout -f main
          git reset --hard origin/main

          echo "== Install dependencies =="
          npm ci

          echo "== Generate Prisma Client =="
          npx prisma generate

          echo "== Build application =="
          npm run build

          echo "== Apply production migrations =="
          npx prisma migrate deploy

          echo "== Restart application =="
          pm2 restart wordy-be

          echo "== Deployment completed =="
          git rev-parse --short HEAD
          REMOTE

      - name: Health check
        run: |
          set -Eeuo pipefail

          for attempt in {1..10}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              https://wordy-be.p-e.kr/ > /dev/null; then
              echo "Health check passed"
              exit 0
            fi

            echo "Health check failed (${attempt}/10). Retrying..."
            sleep 3
          done

          echo "Health check failed after 10 attempts"
          exit 1
