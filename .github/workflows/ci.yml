name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generate and Build
    runs-on: ubuntu-latest

    env:
      # prisma.config.ts에서 DATABASE_URL을 읽는 경우를 위한 CI용 형식값입니다.
      # generate/build 과정에서는 실제 DB에 접속하지 않습니다.
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/wordy_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build